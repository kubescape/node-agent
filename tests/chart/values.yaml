clusterName: "cluster"
ksNamespace: kubescape
logger:
  level: debug
  name: zap
volumes: [ ]
volumeMounts: [ ]

capabilities:
  runtimeObservability: enable
  networkPolicyService: enable
  runtimeDetection: enable
  # No in-tree malware scanner exists, and the test that covered it is gone, so
  # enabling this only writes a flag nothing reads into every test bundle.
  malwareDetection: disable
  httpDetection: enable

configurations:
  persistence: disable # Because github runners doesn't want to create pvcs 
  prometheusAnnotations: disable

persistence:
  storageClass: "-"
  accessMode: ReadWriteOnce
  size:
    backingStorage: 5Gi
    kubevuln: 2Gi

global:
  namespaceTier: ks-control-plane
  cloudConfig: ks-cloud-config
  overrideRuntimePath: ""

storage:
  name: "storage"
  image:
    repository: quay.io/kubescape/storage
    tag: v0.0.156
    pullPolicy: Always
  cleanupInterval: "6h"
  labels:
    app.kubernetes.io/name: "storage"
    app.kubernetes.io/component: "apiserver"
    app.kubernetes.io/part-of: "kubescape-storage"
  resources:
    requests:
      cpu: 100m
      memory: 400Mi
    limits:
      cpu: 500m
      memory: 1500Mi
nodeAgent:
  # The component tests run the agent with the Go profiler on. This used to ride
  # on capabilities.malwareDetection, which had nothing to do with it.
  enableProfiler: true
  name: node-agent
  image:
    repository: quay.io/kubescape/node-agent
    tag: v0.2.21
    pullPolicy: IfNotPresent

  config:
    maxLearningPeriod: 2m
    learningPeriod: 1m
    updatePeriod: 30s
    maxDelaySeconds: 1
    prometheusExporter: enable
    httpExporterConfig: {}
    alertManagerExporterUrls: [
      "alertmanager-operated.monitoring.svc.cluster.local:9093"
    ]
    stdoutExporter: true
    syslogExporterURL: ""
    ruleCooldown:
      ruleCooldownDuration: 1h
      ruleCooldownAfterCount: 10 # for tests
      ruleCooldownOnProfileFailure: true
      ruleCooldownMaxSize: 20000
    celConfigCache:
      maxSize: 250000
      ttl: 1s
    profileProjection:
      detailedMetricsEnabled: true
      strictValidation: false
    # Sandbox policy enforcement is off unless configured here
    # (docs/features/sandbox-policy.md). The G020 shared engine runs on every
    # kernel IG's product kernel gate admits, on the product image compiled
    # into the agent. sharedImages (a map from kernel BTF sha256 to an image)
    # is only for agents older than the image floor; current agents ignore it
    # and warn once at start. image, controlRoot and maxOwners are legacy
    # keys: current agents ignore them (warning once at start if set), but
    # agents below the legacy-key floor (docs/features/sandbox-policy.md,
    # Rollout order) refuse to start without image and controlRoot, so set
    # them while such agents may run. Example:
    #   sandboxPolicy:
    #     enabled: true
    #     containerdSocket: /run/containerd/containerd.sock
    #     image: REPLACE_ME                 # required by agents below the legacy-key floor
    #     controlRoot: /var/run/node-agent-sandbox  # required by agents below the legacy-key floor
    #     sharedImages:
    #       "<kernel BTF sha256>":
    #         image: REPLACE_ME             # image name inside tracers.tar
    #         manifestDigest: sha256:...    # its amd64 image manifest digest
    #         profile: {Version: 1, ...}    # the profile it was built with
    #     imageProcRoot: /host/proc         # optional host procfs (default)
    #     imageHostRoot: /host              # optional host root (default)
    sandboxPolicy: {}

  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 15s

  resources:
    requests:
      cpu: 100m
      memory: 180Mi
    limits:
      cpu: 500m
      memory: 1500Mi

  env:
    - name: NodeName
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName

  privileged: false
  seLinuxType: spc_t

  volumeMounts:
    # HostToContainer (rslave): mounts the host creates after node-agent starts
    # (pod sandbox /dev/shm, kubelet secret/projected tmpfs) must be visible
    # through /host for bind-volume provenance; None hides them.
    - mountPath: /host
      name: host
      mountPropagation: HostToContainer
    - mountPath: /run
      name: run
      mountPropagation: HostToContainer
    - mountPath: /lib/modules
      name: modules
    - mountPath: /sys/kernel/debug
      name: debugfs
    - mountPath: /sys/fs/cgroup
      name: cgroup
    - mountPath: /sys/fs/bpf
      name: bpffs
    - mountPath: /data
      name: data

  volumes:
    - hostPath:
        path: /
      name: host
    - hostPath:
        path: /run
      name: run
    - hostPath:
        path: /sys/fs/cgroup
      name: cgroup
    - hostPath:
        path: /lib/modules
      name: modules
    - hostPath:
        path: /sys/fs/bpf
      name: bpffs
    - hostPath:
        path: /sys/kernel/debug
      name: debugfs
    - emptyDir:
      name: data
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                  - linux
  nodeSelector:
    kubernetes.io/os: linux
