apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: cel-state-app
  name: cel-state-deployment
spec:
  selector:
    matchLabels:
      app: cel-state-app
  replicas: 1
  template:
    metadata:
      labels:
        app: cel-state-app
    spec:
      containers:
      # alpine's busybox provides nc, so the trigger needs no package install --
      # the kind node may have no outbound internet.
      - name: probe
        image: alpine:3.20
        command: ["sleep", "infinity"]
