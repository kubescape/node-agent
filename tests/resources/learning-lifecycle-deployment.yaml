apiVersion: apps/v1
kind: Deployment
metadata:
  name: learner
  labels:
    app: learner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: learner
  template:
    metadata:
      labels:
        app: learner
    spec:
      containers:
      - name: app
        image: debian:12-slim
        command: ["/usr/bin/sleep", "infinity"]
