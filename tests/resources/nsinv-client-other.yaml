apiVersion: apps/v1
kind: Deployment
metadata:
  name: nsinv-client
  labels: {app: nsinv-other}
spec:
  replicas: 1
  selector: {matchLabels: {app: nsinv-other}}
  template:
    metadata:
      labels: {app: nsinv-other}
    spec:
      containers:
      - name: client
        image: docker.io/curlimages/curl@sha256:08e466006f0860e54fc299378de998935333e0e130a15f6f98482e9f8dab3058
        command: ["sleep", "infinity"]
