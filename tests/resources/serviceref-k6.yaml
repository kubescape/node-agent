apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-script
data:
  load.js: |
    import http from 'k6/http';
    import { sleep } from 'k6';
    export const options = { vus: 2, duration: '30m' };
    export default function () {
      http.get('http://helm-primary/index.yaml', { timeout: '5s' });
      sleep(1);
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k6-load
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k6-load
  template:
    metadata:
      labels:
        app: k6-load
    spec:
      containers:
        - name: k6
          image: grafana/k6:0.49.0
          args: ["run", "/scripts/load.js", "--quiet", "--no-usage-report"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          resources:
            limits:
              cpu: 200m
              memory: 192Mi
      volumes:
        - name: scripts
          configMap:
            name: k6-script
