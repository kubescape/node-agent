# Binds the test-only state-counter rules; see cel-state-rulebinding.yaml.
apiVersion: kubescape.io/v1
kind: RuntimeRuleAlertBinding
metadata:
  name: cel-count-test-binding
spec:
  namespaceSelector:
    matchExpressions:
      - key: "kubernetes.io/metadata.name"
        operator: "NotIn"
        values:
          - "kube-system"
          - "kube-public"
          - "kube-node-lease"
  podSelector:
  rules:
    - ruleName: "TEST state counter third exec"
    - ruleName: "TEST state counter negative control"
    - ruleName: "TEST state counter exec control"
