# User-defined ContainerProfile for the fusioncore network scenario (Test_28).
#
# The "new way" migration of the former user-defined NetworkNeighborhood
# (known-network-neighborhood.yaml): a single ContainerProfile replaces the
# AP + NN pair. Bind it to a workload with the pod label
#   kubescape.io/user-defined-profile: fusioncore-network
#
# A user-managed profile carries ONLY name (+ namespace, injected by tooling).
# It has NO learning-lifecycle annotations (status/completion) and NO managed-by
# marker — those are meaningless on an authored profile. When signed, the signing
# tooling adds a signature annotation; nothing else.
#
# Modeled after a real auto-learned neighbourhood from curlimages/curl:8.5.0.
# Allows exactly fusioncore.ai (162.0.217.171) on TCP/80. Anything else alerts
# (unknown domain → R0005, unknown IP → R0011). See 00-fusioncore-homoglyph-attack
# in network-wildcards-cp/ for why the exact-match dnsNames allow-list matters.
apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ContainerProfile
metadata:
  name: fusioncore-network
spec:
  matchLabels:
    app: curl-fusioncore-28-1
  ingress: []
  egress:
  - identifier: a5e64ff1db824089b1706ac872303e55075f92cf6a652b5272f06c3a2b9e8d10
    type: external
    dnsNames:
    - fusioncore.ai.
    ipAddress: 162.0.217.171
    ports:
    - name: TCP-80
      protocol: TCP
      port: 80
