apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: loopback
  name: loopback
spec:
  selector:
    matchLabels:
      app: loopback
  replicas: 1
  template:
    metadata:
      labels:
        app: loopback
    spec:
      containers:
      - name: loopserver
        image: nginx:1.14.2
        ports:
        - containerPort: 80
      - name: loopclient
        image: docker.io/curlimages/curl@sha256:08e466006f0860e54fc299378de998935333e0e130a15f6f98482e9f8dab3058
        command: ["sleep", "infinity"]
