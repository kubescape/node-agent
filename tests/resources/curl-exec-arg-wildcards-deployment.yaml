# Curl pod for Test_32_UnexpectedProcessArguments. The pod label
# kubescape.io/user-defined-profile binds it to the authored ContainerProfile of
# the same name that the test creates.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: curl-32
  name: curl-32
spec:
  selector:
    matchLabels:
      app: curl-32
  replicas: 1
  template:
    metadata:
      labels:
        app: curl-32
        kubescape.io/user-defined-profile: curl-32-overlay
    spec:
      containers:
      - name: curl
        image: docker.io/curlimages/curl@sha256:08e466006f0860e54fc299378de998935333e0e130a15f6f98482e9f8dab3058
        command: ["sleep", "infinity"]
