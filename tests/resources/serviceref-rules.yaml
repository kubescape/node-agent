apiVersion: kubescape.io/v1
kind: Rules
metadata:
  name: serviceref-test-rules
  namespace: kubescape
  labels:
    app: kubescape
spec:
  rules:
    - name: "TEST internal egress not in profile"
      enabled: true
      id: "R9911"
      description: "Test rule: egress to a cluster-internal address the profile does not allow. The shipped R0011 excludes private destinations, so in-cluster lateral movement — exactly what serviceRef/serviceSelector narrow down — is invisible to it. Scoped to the serviceRef suite via its own binding so no other test's namespace is affected."
      expressions:
        message: "'Unexpected internal egress to: ' + event.dstAddr + ':' + string(event.dstPort) + ' from: ' + event.containerName"
        uniqueId: "'R9911_' + event.dstAddr + '_' + string(event.dstPort)"
        ruleExpression:
          - eventType: "network"
            expression: "event.pktType == 'OUTGOING' && net.is_private_ip(event.dstAddr) && !cp.was_address_in_egress(event.containerId, event.dstAddr)"
      profileDependency: 0
      profileDataRequired:
        egressAddresses: all
      severity: 5
      supportPolicy: false
      isTriggerAlert: false
      mitreTactic: "TA0008"
      mitreTechnique: "T1210"
