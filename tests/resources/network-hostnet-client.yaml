apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: hostnet-client
  name: hostnet-client
spec:
  selector:
    matchLabels:
      app: hostnet-client
  replicas: 1
  template:
    metadata:
      labels:
        app: hostnet-client
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: curl
        image: docker.io/curlimages/curl@sha256:08e466006f0860e54fc299378de998935333e0e130a15f6f98482e9f8dab3058
        command: ["sleep", "infinity"]
