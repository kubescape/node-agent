apiVersion: apps/v1
kind: Deployment
metadata:
  name: nsinv-server
  labels: {app: nsinv-server}
spec:
  replicas: 1
  selector: {matchLabels: {app: nsinv-server}}
  template:
    metadata:
      labels: {app: nsinv-server, kubescape.io/user-defined-profile: nsinv-server-cp}
    spec:
      containers:
      - name: server
        image: nginx:1.14.2
        ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: nsinv-server
spec:
  selector: {app: nsinv-server}
  ports: [{port: 80, targetPort: 80}]
