apiVersion: kubescape.io/v1
kind: Rules
metadata:
  annotations:
    signature.kubescape.io/certificate: 
    signature.kubescape.io/content: 
    signature.kubescape.io/identity: local-key
    signature.kubescape.io/issuer: local
    signature.kubescape.io/signature: MEQCIHWRBt1rfDCCVxxp/O7E7HpC28zLApJu7S5ViUMaka3FAiBFiuruI/abZiFo6UM83CXHPtFVbMVxTEtuzaC7UQWGsQ==
    signature.kubescape.io/timestamp: "1789929998"
  labels:
    signature.kubescape.io/bundle: bundle37
    signature.kubescape.io/fragment-class: overlay
  name: ct-bundle37-overlay-rules
spec:
  rules:
  - agentVersionRequirement: ""
    description: Bundle-scoped overlay of R0001, second revision, for the stacking
      component test
    enabled: true
    expressions:
      message: '''BUNDLE OVERLAY V2 R0001: unexpected process '' + event.comm + ''
        with PID '' + string(event.pid)'
      ruleExpression:
      - eventType: exec
        expression: '!cp.was_executed(event.containerId, parse.get_exec_path(event.args,
          event.comm, event.exepath))'
      uniqueId: event.comm + '_' + event.exepath
    id: R0001
    isTriggerAlert: true
    mitreTactic: TA0002
    mitreTechnique: T1059
    name: Unexpected process launched
    profileDataRequired:
      capabilities: null
      egressAddresses: null
      egressDomains: null
      endpoints: null
      execs: all
      ingressAddresses: null
      ingressDomains: null
      opens: null
      syscalls: null
    profileDependency: 0
    severity: 8
    supportPolicy: false
    tags:
    - context:kubernetes
    - context:container
    - anomaly
    - process
    - exec
    - applicationprofile
