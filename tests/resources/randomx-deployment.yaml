apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: randomx
  name: randomx-deployment
spec:
  selector:
    matchLabels:
      app: randomx
  replicas: 1
  template:
    metadata:
      labels:
        app: randomx
    spec:
      containers:
      - name: randomx
        image: python:3.12-slim
        command: ["sleep", "infinity"]
