apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: randomx
  name: randomx-deployment
spec:
  selector:
    matchLabels:
      app: randomx
  replicas: 1
  template:
    metadata:
      labels:
        app: randomx
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
      - name: randomx
        image: docker.io/library/python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
        command: ["sleep", "infinity"]
