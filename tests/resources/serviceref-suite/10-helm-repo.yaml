apiVersion: v1
kind: ConfigMap
metadata:
  name: helm-repo-index
data:
  index.yaml: |
    apiVersion: v1
    entries: {}
    generated: "2020-01-01T00:00:00Z"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helm-repo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helm-repo
  template:
    metadata:
      labels:
        app: helm-repo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: index
              mountPath: /usr/share/nginx/html
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: index
          configMap:
            name: helm-repo-index
---
apiVersion: v1
kind: Service
metadata:
  name: helm-primary
  labels:
    role: helm-repo
spec:
  selector:
    app: helm-repo
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: helm-mirror
  labels:
    role: helm-repo
spec:
  selector:
    app: helm-repo
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: decoy-repo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: decoy-repo
  template:
    metadata:
      labels:
        app: decoy-repo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: index
              mountPath: /usr/share/nginx/html
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: index
          configMap:
            name: helm-repo-index
---
apiVersion: v1
kind: Service
metadata:
  name: decoy-repo
spec:
  selector:
    app: decoy-repo
  ports:
    - port: 80
      targetPort: 80
