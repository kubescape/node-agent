name: enforce_privilege
behavior: mutator
description: "Enforce privilege rules (capabilities, namespaces, mounts, ptrace, modules) for a live set of containers (BPF LSM)"
annotations:
  enable-containers-datasource: "true"
  enforce-privilege: "true"
  sandbox-bindings-version: "1"
datasources:
  verdict:
    fields:
      hook_raw:
        annotations:
          columns.hidden: true
      syscall_raw:
        annotations:
          columns.hidden: true
      fault_raw:
        annotations:
          columns.hidden: true
  containers:
    annotations:
      cli.default-output-mode: none
params:
  ebpf:
    host_mntns_id:
      key: host-mntns-id
      defaultValue: "0"
      description: mount namespace inode of the container runtime; 0 uses the global init task's
    arming_fail_fork_marks:
      key: arming-fail-fork-marks
      defaultValue: "0"
      description: test only - nonzero fails every child arming mark at fork (fault injection); the owner forces it to 0 outside kernel tests
    arming_fail_exec_marks:
      key: arming-fail-exec-marks
      defaultValue: "0"
      description: test only - nonzero fails every exec arming mark (fault injection); the owner forces it to 0 outside kernel tests
    policy_fail_headers:
      key: policy-fail-headers
      defaultValue: "0"
      description: test only - nonzero makes every slot miss its policy header (fault injection); the owner forces it to 0 outside kernel tests
    cred_record_fail:
      key: cred-record-fail
      defaultValue: "0"
      description: test only - nonzero fails every record of credentials (fault injection); the owner forces it to 0 outside kernel tests
    cred_forget_fail:
      key: cred-forget-fail
      defaultValue: "0"
      description: test only - nonzero makes cred_free delete nothing, as without an LSM with a cred blob (fault injection); the owner forces it to 0 outside kernel tests
