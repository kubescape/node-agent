name: Standalone registration regression
on:
  push:
    branches: [codex/standalone-pod-retries-4717]
permissions:
  contents: read
jobs:
  linux-tests:
    if: github.repository == 'devantler/node-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOFLAGS: -mod=readonly
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
      - name: Exercise standalone and partial Kubernetes registration
        run: go test -p 2 -count=1 -timeout=2m -run 'Test.*Standalone' ./pkg/rulemanager ./pkg/containerwatcher/v2
      - name: Run affected package tests with the race detector
        run: go test -p 2 -race -count=1 -timeout=10m ./pkg/utils ./pkg/rulemanager ./pkg/containerwatcher/v2
      - name: Vet affected packages
        run: go vet -p 2 ./pkg/utils ./pkg/rulemanager ./pkg/containerwatcher/v2
